name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# Private repo: Actions minutes are metered. Cancel superseded runs, and only
# run on push for master (branch pushes are covered by pull_request).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: ShellCheck
        run: shellcheck get.sh install.sh claude-sync.sh npm-tools.sh gh-tools.sh python-tools.sh

      - name: Validate renovate.json is valid JSON
        run: jq empty renovate.json

      - name: Validate dot-claude/settings.json is valid JSON (if present)
        run: |
          if [ -f dot-claude/settings.json ]; then
            jq empty dot-claude/settings.json
          fi

      - name: Validate per-machine settings overrides are JSON objects
        run: |
          for f in machines/*.settings.json; do
            [ -e "$f" ] || continue
            jq -e 'type == "object"' "$f" >/dev/null || { echo "$f must be a JSON object"; exit 1; }
          done

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1 # renovate: datasource=github-releases depName=gitleaks/gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --source . -v

  pytest:
    # The Windows leg lives in ci-windows.yml so a paths filter can skip it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: Install pytest
        env:
          PYTEST_VERSION: 9.2.0 # renovate: datasource=pypi depName=pytest
        run: python -m pip install "pytest==${{ env.PYTEST_VERSION }}"

      - name: Run pytest suite
        run: python -m pytest tests/py -v
